apiVersion: v1
kind: Service
metadata:
    name: {{ .Release.Name }}-service
spec:
    type: {{ .Values.service.type }}
    selector:
        app: {{ .Chart.Name }}
    ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
          targetPort: {{ .Values.containerPort }}
          nodePort: 30080   # range 30000-32767

